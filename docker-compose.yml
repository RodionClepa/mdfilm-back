services:
  postgres:
    image: postgres:17
    container_name: prisma-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: username
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mdfilm
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
